version: 0.2

phases:
  install:
    commands:
      - npm install -g aws-cdk
      - pip install -r requirements.txt

  build:
    commands:
      # List files at root to confirm presence of your stack folder and app.py
      - echo "Listing root files:"
      - ls -l
      - echo "Listing cdk_project_9015480 folder contents:"
      - ls -l cdk_project_9015480 || echo "Folder not found"
      
      # Print Python sys.path to help debug import issues
      - echo "Python sys.path:"
      - python3 -c "import sys; print(sys.path)"
      
      # Run cdk synth and deploy
      - cdk synth
      - cdk deploy --require-approval never

artifacts:
  files:
    - '**/*'
