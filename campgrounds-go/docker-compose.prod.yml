version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.multi-stage
    ports:
      - "3000:3000"
    environment:
      - GIN_MODE=release
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USER=yelpcamp_prod
      - MONGO_PASSWORD=${MONGO_PASSWORD:-prod_secure_password_123}
      - MONGO_DATABASE=yelpcamp_prod
      - JWT_SECRET=${JWT_SECRET:-prod_jwt_super_secret_key_2024}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - yelpcamp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=yelpcamp_prod
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-prod_secure_password_123}
      - MONGO_INITDB_DATABASE=yelpcamp_prod
    volumes:
      - mongo_prod_data:/data/db
      - ./scripts/mongo-init-prod.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - yelpcamp-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=campgrounds_prod
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=campgrounds_prod_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-prod.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campgrounds_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - yelpcamp-network

volumes:
  mongo_prod_data:
  postgres_prod_data:

networks:
  yelpcamp-network:
    driver: bridge
