<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.campground.title}} - YelpCamp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-campground"></i> YelpCamp
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/campgrounds">All Campgrounds</a>
                <a class="nav-link" href="/register">Register</a>
                <a class="nav-link" href="/login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-8">
                <div class="card shadow">
                    <img src="{{.campground.image}}" class="card-img-top" alt="{{.campground.title}}" style="height: 400px; object-fit: cover;">
                    <div class="card-body">
                        <h1 class="card-title">{{.campground.title}}</h1>
                        <p class="text-muted mb-3">
                            <i class="fas fa-map-marker-alt"></i> {{.campground.location}}
                        </p>
                        <p class="card-text">{{.campground.description}}</p>
                        
                        <h5 class="mt-4">Amenities</h5>
                        <ul class="list-unstyled">
                            {{range .campground.amenities}}
                            <li><i class="fas fa-check text-success"></i> {{.}}</li>
                            {{end}}
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Booking Information</h5>
                        <h3 class="text-success">${{.campground.price}}/night</h3>
                        <button class="btn btn-success btn-lg w-100 mb-3">Book Now</button>
                        <button class="btn btn-outline-primary w-100">Add to Favorites</button>
                    </div>
                </div>

                <div class="card shadow mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Leave a Review</h5>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Rating</label>
                                <select class="form-select">
                                    <option>5 - Excellent</option>
                                    <option>4 - Very Good</option>
                                    <option>3 - Good</option>
                                    <option>2 - Fair</option>
                                    <option>1 - Poor</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Review</label>
                                <textarea class="form-control" rows="4" placeholder="Share your experience..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Review</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <a href="/campgrounds" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left"></i> Back to All Campgrounds
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
