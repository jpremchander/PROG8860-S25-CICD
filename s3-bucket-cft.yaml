AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Bucket for CloudFormation Template

Parameters:
  BucketName:
    Description: Name of the S3 bucket to create.
    Type: String
    Default: cicd-9015480-s3-bucket

  BucketVersioning:
    Description: Enable versioning for the S3 bucket.
    Type: String
    Default: true
    AllowedValues:
      - true
      - false
    ConstraintDescription: Must be either 'true' or 'false'.

  Environment:
    Description: Environment name tag for the S3 bucket.
    Type: String
    Default: dev

Conditions:
  EnableVersioning: 
    Fn::Equals:
      - Ref: BucketVersioning
      - "true"

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 
        Ref: BucketName
      AccessControl: Private
      VersioningConfiguration:
        Status: 
          Fn::If:
            - EnableVersioning
            - Enabled
            - Suspended
      Tags:
        - Key: Name
          Value: 
            Ref: BucketName
        - Key: Environment
          Value: 
            Ref: Environment
        - Key: CreatedBy
          Value: CloudFormation

Outputs:
  BucketName:
    Description: Name of the created S3 bucket.
    Value: 
      Ref: S3Bucket

  BucketArn:
    Description: ARN of the created S3 bucket.
    Value: 
      Fn::GetAtt: [S3Bucket, Arn]
  BucketVersioningStatus:
    Description: Versioning status of the S3 bucket.
    Value: 
      Fn::If:
        - EnableVersioning
        - "Enabled"
        - "Suspended"
  BucketEnvironment:
    Description: Environment tag of the S3 bucket.
    Value: 
      Ref: Environment