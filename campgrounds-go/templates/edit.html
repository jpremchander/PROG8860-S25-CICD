<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🏕️ YelpCamp</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/campgrounds">View Campgrounds</a>
                <a class="nav-link" href="/campgrounds/new">Add Campground</a>
                <a class="nav-link" href="/api/docs">API Docs</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">Edit Campground</h2>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="/campgrounds/{{.campground.ID}}">
                            <div class="mb-3">
                                <label for="title" class="form-label">Campground Name</label>
                                <input type="text" class="form-control" id="title" name="title" value="{{.campground.Title}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location" value="{{.campground.Location}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="price" class="form-label">Price per Night ($)</label>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" value="{{.campground.Price}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" required>{{.campground.Description}}</textarea>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/campgrounds/{{.campground.ID}}" class="btn btn-secondary me-md-2">Cancel</a>
                                <button type="submit" class="btn btn-warning">Update Campground</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
