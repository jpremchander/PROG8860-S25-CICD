trigger:
- Azure-Function-App  # ✅ your branch name

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Build the Function App'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '6.x'  # change if you're using another .NET version
    - script: |
        dotnet restore
        dotnet build --configuration Release
      displayName: 'Build the Azure Function'
    - task: DotNetCoreCLI@2
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true
      displayName: 'Publish Function App'
    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: drop
      displayName: 'Publish Artifacts'

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
  - job: Test
    displayName: 'Run Unit Tests'
    pool:
      vmImage: 'windows-latest'
    steps:
    - script: |
        dotnet test --configuration Release
      displayName: 'Run Tests'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Test
  jobs:
  - job: Deploy
    displayName: 'Deploy Function to Azure'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: AzureFunctionApp@1
      inputs:
        azureSubscription: 'AFN-CICD-SVC-CONNECTION'   
        appType: 'functionApp'
        appName: 'collapse-api-func'                  
        package: '$(Pipeline.Workspace)/drop/**/*.zip'
