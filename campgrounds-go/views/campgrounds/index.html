<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-3">
        <h1>All Campgrounds</h1>
        <div class="mb-3">
            <a class="btn btn-success" href="/campgrounds/new">Add Campground</a>
        </div>
        
        {{range .campgrounds}}
        <div class="card mb-3">
            <div class="row g-0">
                <div class="col-md-4">
                    {{if .Images}}
                        <img src="{{(index .Images 0).URL}}" class="img-fluid rounded-start" alt="{{.Title}}">
                    {{else}}
                        <img src="https://via.placeholder.com/300x200" class="img-fluid rounded-start" alt="{{.Title}}">
                    {{end}}
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h5 class="card-title">{{.Title}}</h5>
                        <p class="card-text">{{.Description}}</p>
                        <p class="card-text">
                            <small class="text-muted">{{.Location}}</small>
                        </p>
                        <a href="/campgrounds/{{.ID.Hex}}" class="btn btn-primary">View {{.Title}}</a>
                    </div>
                </div>
            </div>
        </div>
        {{end}}
    </div>
</body>
</html>
