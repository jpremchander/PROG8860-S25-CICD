version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: yelpcamp_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: yelpcamp_dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - yelpcamp_network

  app:
    build: .
    container_name: yelpcamp_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: yelpcamp_dev
      
      # JWT will be auto-generated by the application
      # No need to set JWT_SECRET here - it will be created automatically
      
      # Server Configuration
      PORT: 3000
      GIN_MODE: debug
      ENVIRONMENT: development
      
      # Upload Configuration
      UPLOAD_PATH: ./static/uploads
      MAX_UPLOAD_SIZE: 5242880
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./.env:/app/.env  # Mount .env for JWT secret persistence
    depends_on:
      - mongodb
    networks:
      - yelpcamp_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=campgrounds
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=campgrounds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  postgres_data:

networks:
  yelpcamp_network:
    driver: bridge
