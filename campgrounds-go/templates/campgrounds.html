<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} - YelpCamp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-campground"></i> YelpCamp
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/campgrounds">All Campgrounds</a>
                <a class="nav-link" href="/register">Register</a>
                <a class="nav-link" href="/login">Login</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">{{.title}}</h1>
                <p class="lead">Discover amazing campgrounds from around the world</p>
            </div>
        </div>

        <div class="row">
            {{range .campgrounds}}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow">
                    <img src="{{.image}}" class="card-img-top" alt="{{.title}}" style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{.title}}</h5>
                        <p class="card-text">{{.description}}</p>
                        <div class="mt-auto">
                            <p class="text-muted mb-2">
                                <i class="fas fa-map-marker-alt"></i> {{.location}}
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="h5 text-success mb-0">${{.price}}/night</span>
                                <a href="/campgrounds/{{.id}}" class="btn btn-primary">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {{end}}
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="/" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
