version: '3.8'

services:
  # Development service
  campgrounds-dev:
    build:
      context: .
      target: development
    container_name: campgrounds-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GIN_MODE=debug
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/tmp  # Exclude tmp directory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - campgrounds-network
    profiles:
      - dev

  # Production service
  campgrounds-prod:
    build:
      context: .
      target: production
    container_name: campgrounds-prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GIN_MODE=release
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - campgrounds-network
    profiles:
      - prod

networks:
  campgrounds-network:
    driver: bridge
