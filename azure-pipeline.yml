trigger:
  branches:
    include:
      - Azure-Function-App

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: Build
    displayName: 'Build Python Azure Function'
    pool:
      name: 'Default'  # Your self-hosted Windows agent
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        pip install -r requirements.txt
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Install Dependencies'

    - powershell: |
        Add-Type -Assembly 'System.IO.Compression.FileSystem'
        [IO.Compression.ZipFile]::CreateFromDirectory("$(Build.SourcesDirectory)", "$(Build.ArtifactStagingDirectory)\function.zip")
      displayName: 'Package Function App'

    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: drop

- stage: Test
  displayName: 'Test Stage'
  dependsOn: Build
  jobs:
  - job: Test
    displayName: 'Run Unit Tests'
    pool:
      name: 'Default'
    steps:
    - script: |
        pip install -r requirements.txt
        python -m pytest tests/
      workingDirectory: $(Build.SourcesDirectory)
      displayName: 'Run Python Tests'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Test
  jobs:
  - job: Deploy
    displayName: 'Deploy Python Function to Azure'
    pool:
      name: 'Default'
    steps:
    - task: AzureFunctionApp@1
      inputs:
        azureSubscription: 'AFN-CICD-SVC-CONNECTION'
        appType: 'functionAppWindows'  # If you're using Windows-based Azure Function App
        appName: 'collapse-api-func'
        package: '$(Pipeline.Workspace)/drop/function.zip'
