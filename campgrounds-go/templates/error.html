<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🏕️ YelpCamp</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/campgrounds">View Campgrounds</a>
                <a class="nav-link" href="/campgrounds/new">Add Campground</a>
                <a class="nav-link" href="/api/docs">API Docs</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0">{{.title}}</h3>
                    </div>
                    <div class="card-body text-center">
                        <p class="card-text">{{.error}}</p>
                        <a href="/campgrounds" class="btn btn-primary">Back to Campgrounds</a>
                        <a href="/" class="btn btn-secondary">Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
