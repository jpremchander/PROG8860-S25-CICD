version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=campgrounds
      - DB_PASSWORD=password
      - DB_NAME=campgrounds_db
      - DB_PORT=5432
      - JWT_SECRET=your_super_secret_jwt_key_here
    depends_on:
      - postgres
    volumes:
      - ./templates:/root/templates
      - ./public:/root/public

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=campgrounds
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=campgrounds_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
