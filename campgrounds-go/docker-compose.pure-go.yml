version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - GIN_MODE=debug
      - PORT=3000
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_USER=yelpcamp_dev
      - MONGO_PASSWORD=dev_password_123
      - MONGO_DATABASE=yelpcamp_dev
      - JWT_SECRET=your_super_secret_jwt_key_here
      - CLOUDINARY_CLOUD_NAME=dl0zvwr9i
      - CLOUDINARY_API_KEY=719144713242759
      - CLOUDINARY_API_SECRET=tCIGtTFz8vvEem2Vl1HuOd_7xhE
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yelpcamp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=yelpcamp_dev
      - MONGO_INITDB_ROOT_PASSWORD=dev_password_123
      - MONGO_INITDB_DATABASE=yelpcamp_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - yelpcamp-network

volumes:
  mongo_data:

networks:
  yelpcamp-network:
    driver: bridge
