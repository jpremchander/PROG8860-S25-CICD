<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-campground"></i> YelpCamp
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/campgrounds">All Campgrounds</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Edit Campground</h2>
                        
                        {{if .error}}
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i> {{.error}}
                        </div>
                        {{end}}
                        
                        <form method="POST" action="/campgrounds/{{.campground.ID}}" enctype="multipart/form-data">
                            <input type="hidden" name="_method" value="PUT">
                            
                            <div class="mb-3">
                                <label for="title" class="form-label">Campground Name</label>
                                <input type="text" class="form-control" id="title" name="title" value="{{.campground.Title}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="location" class="form-label">Location</label>
                                <input type="text" class="form-control" id="location" name="location" value="{{.campground.Location}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="price" class="form-label">Price per Night ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" value="{{.campground.Price}}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="4" required>{{.campground.Description}}</textarea>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Update Campground
                                </button>
                                <a href="/campgrounds/{{.campground.ID}}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
